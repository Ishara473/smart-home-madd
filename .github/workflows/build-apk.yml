name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyCKKBG1xohSZx8KA6xNFOmmx9anPsAzyzY
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: smart-home-monitoring-sy-38505.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: smart-home-monitoring-sy-38505
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: smart-home-monitoring-sy-38505.firebasestorage.app
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "739819003559"
      EXPO_PUBLIC_FIREBASE_APP_ID: "1:739819003559:web:b8fb7d50a40d0517ab8582"
      EXPO_PUBLIC_USE_MOCK_DATA: "false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install --legacy-peer-deps

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK via Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartHome-Monitoring-v1.0.apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
