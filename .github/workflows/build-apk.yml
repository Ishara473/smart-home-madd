name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd mobile
          npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to EAS
        run: eas login --non-interactive --token ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: |
          cd mobile
          eas build --platform android --profile preview --non-interactive

      - name: Get Build URL
        run: |
          cd mobile
          BUILD_INFO=$(eas build:list --limit=1 --platform=android --non-interactive --json)
          BUILD_URL=$(echo $BUILD_INFO | jq -r '.[0].artifacts[0].url')
          echo "BUILD_URL=$BUILD_URL" >> $GITHUB_ENV

      - name: Display Build Information
        run: |
          echo "## APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "Download your APK from: ${{ env.BUILD_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Or visit the EAS dashboard:" >> $GITHUB_STEP_SUMMARY
          echo "https://expo.dev/accounts/[your-account]/projects/smart-home-monitoring-system/builds" >> $GITHUB_STEP_SUMMARY
